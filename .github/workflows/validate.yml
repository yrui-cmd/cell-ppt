name: Validate Nature PPT

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Compile runtime
        run: python -m compileall -q install.py doctor.py plugins/nature-ppt/skills/nature-ppt/scripts tests
      - name: Test Nature PPT
        run: python tests/test_nature_ppt.py
      - name: Test PowerPoint output
        run: python tests/test_cross_platform.py
      - name: Validate shell setup
        if: runner.os == 'macOS'
        run: bash -n ./setup.sh
